<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario De Estudiantes </title>
        <link rel="stylesheet" href="../CSS/pages/form-style.css">
    </head>
    <body class="body-form">
        <div class="container-forms">
            <form class="form-estudiantes">
                <h2 class="title-form">Crear Estudiante</h2>
                <div class="form-group inputs">
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre">
                    <label for="apellido" name="apellido">Apellido:</label>
                    <input type="text" name="apellido">
                    <label for="correo" name="correo">Correo:</label>
                    <input type="correo" name="correo">
                    <label for="celular" name="celular">Celular:</label>
                    <input type="celular" name="celular">
                </div>
                <div class="form-group-btns">
                    <button class="add-btn">Crear</button>
                    <button class="cancel-btn">Cancelar</button>
                </div>
            </form>
        </div>
    </body>
</html>
