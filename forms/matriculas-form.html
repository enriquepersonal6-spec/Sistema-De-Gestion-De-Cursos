<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario De Estudiantes </title>
        <link rel="stylesheet" href="../CSS/pages/form-style.css">
    </head>
    <body class="body-form">
        <div class="container-forms">
            <form class="form-matriculas">
                <h2 class="title-form">Crear Matrícula</h2>
                <div class="form-group inputs">
                    <label for="nombre">Estudiante:</label>
                    <input type="text" name="nombre">
                    <label for="curso" name="curso">Curso:</label>
                    <input type="text" name="curso">
                    <label for="estado" name="estado">Estado:</label>
                    <input type="text" name="estado">
                    <label for="sede" name="sede">Sede:</label>
                    <input type="text" name="sede">
                </div>
                <div class="form-group-btns">
                    <button class="add-btn">Crear</button>
                    <button class="cancel-btn">Cancelar</button>
                </div>
            </form>
        </div>
    </body>
</html>
